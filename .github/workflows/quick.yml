# Verificação rápida em todo push e PR (specs/018, ADR 0008).
# Durante o MVP não há remoto nem push (ADR 0018); validado localmente por
# scripts/lint-workflows.sh (passo `workflows` do verify-full).
name: quick

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFUMPT_VERSION: v0.12.0
  GOLANGCI_LINT_VERSION: v2.15.0
  # Porta do Valkey usada pelo scripts/verify.sh (mesma do .env).
  VALKEY_PORT: "16379"

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # O verify quick calcula o escopo com git merge-base HEAD origin/main.
          fetch-depth: 0

      - name: Garante origin/main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Ferramentas (gofumpt e golangci-lint)
        run: |
          go install "mvdan.cc/gofumpt@${GOFUMPT_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gofumpt
        run: |
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then
            echo "Arquivos fora do gofumpt:"
            echo "$out"
            exit 1
          fi

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: make verify-quick
        env:
          VERIFY_BASE: origin/main
        run: make verify-quick
