# Grafana (ADR 0007, spec 013): datasource Prometheus e dashboard wwz.json
# provisionados a partir desta pasta, montados read-only.
#
# Local (depois de `docker compose up -d` na raiz, que cria a rede do Prometheus):
#   GRAFANA_ADMIN_PASSWORD=x docker compose -f deploy/grafana/docker-compose.yml up -d
#   # http://127.0.0.1:13000 (admin / GRAFANA_ADMIN_PASSWORD)
#
# A rede é a padrão do projeto raiz (`<pasta>_default`, white-wizard_default no
# checkout principal); outra pasta ou projeto: GRAFANA_NETWORK=<projeto>_default.
#
# Produção (host em WWZ_HOST_GRAFANA de autor/prod.env, atrás do Traefik): o deploy
# de prod reaproveita este arquivo e ajusta só o ambiente, por exemplo
#   GRAFANA_NETWORK=<rede do Prometheus de prod>
#   GRAFANA_ROOT_URL=https://grafana-wwz.example.com
#   GRAFANA_PROMETHEUS_URL=http://prometheus:9090
# e acrescenta labels/rede do Traefik num override próprio (deploy/prod/).
services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.2.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_SECURITY_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:13000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-info}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana-dashboards/wwz.json
      # Lidas pelo provisionamento (provisioning/datasources/prometheus.yml).
      GRAFANA_PROMETHEUS_URL: ${GRAFANA_PROMETHEUS_URL:-http://prometheus:9090}
      GRAFANA_SCRAPE_INTERVAL: ${GRAFANA_SCRAPE_INTERVAL:-5s}
    ports:
      # Só no loopback; em produção o acesso é pelo Traefik.
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-13000}:3000"
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [prometheus]
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${GRAFANA_CPUS:-1}"
          memory: "${GRAFANA_MEMORY:-256m}"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

networks:
  prometheus:
    external: true
    name: ${GRAFANA_NETWORK:-white-wizard_default}

volumes:
  grafana-data:
