# Datasource Prometheus provisionado (ADR 0007). O uid fixo é o padrão da
# variável `datasource` do dashboard wwz.json. A URL vem do ambiente:
# local = Prometheus do compose raiz; produção = GRAFANA_PROMETHEUS_URL.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: wwz-prometheus
    type: prometheus
    access: proxy
    url: ${GRAFANA_PROMETHEUS_URL}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: ${GRAFANA_SCRAPE_INTERVAL}
      prometheusType: Prometheus
