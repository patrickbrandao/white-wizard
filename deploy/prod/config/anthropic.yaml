# Produção (ADR 0017, spec 019): porta 8004, Anthropic perfeito, com a assinatura
# OAuth do Claude Code (ADR 0074, spec 006 16.2.1) e o modo estrito do cliente
# (spec 020) em /claude-code.
# Modelo de configuração SEM segredos: os placeholders WWZ_KEY_1..3 e WWZ_OAUTH_KEY são
# trocados por `scripts/prod-deploy.sh render` no servidor (valores do .env); nunca vai
# ao repositório.
# Sem admin.debug: produção não herda o ajuste do compose de dev.
#
# A mesma instância atende duas portas do haproxy `wwz-ports` (spec 019, ADR 0074 item 19):
#   http://<ip público>:8004              raiz: chave (x-api-key) ou token OAuth; num
#                                         haproxy próprio do servidor a 8004 pode estar em
#                                         mode http, que tira o header Connection: não
#                                         serve ao modo estrito
#   http://<ip público>:8008/claude-code  TCP puro, a linha e os headers chegam crus: só o
#                                         Claude Code 2.1.308 (403 forged_request_error)
# O IP público e os hosts da produção ficam em autor/prod.env, fora do git (ADR 0076).
server:
  auth: keys
  reuseport: true

admin:
  debug: false

keys:
  - {key: ${WWZ_KEY_1}, label: prod-1, account: acct-prod, project: proj-prod}
  - {key: ${WWZ_KEY_2}, label: prod-2, account: acct-prod, project: proj-prod}
  - {key: ${WWZ_KEY_3}, label: prod-3, account: acct-prod, project: proj-prod}
  # A assinatura (oauth_key) tem segredo próprio: o valor dela assina os tokens
  # sk-ant-oat01-… do login e é o que POST /api/oauth/claude_cli/create_api_key
  # devolve a quem tiver um token (o consentimento é automático). Por isso não é
  # nenhuma WWZ_KEY_n, só existe aqui e no /anthropic do todos.yaml, só nos
  # modelos claude-* e na conta da cota de 5 h/semana.
  - {key: ${WWZ_OAUTH_KEY}, label: claude-code-oauth, account: acct-claude-max, project: proj-claude-code, models: [claude-sonnet-5-5, claude-opus-5-5, claude-haiku-5-5]}

# Cota da assinatura em dólares (spec 010): base dos anthropic-ratelimit-unified-*
# (utilização = débito da janela / cota da janela) e do 429 de cota. O real não
# publica a cota do Max 20x em dólares; escolha do wwz: US$ 50 em 5 h e US$ 250
# na semana (vira na segunda 00:00 UTC). Zerar: reinício do container (store memory).
accounts:
  - id: acct-claude-max
    limits:
      quota_usd: {monthly_usd: 1000, rolling_5h_pct: 5, weekly_pct: 25}

drivers:
  - {name: anthropic, options: {oauth_key: claude-code-oauth, oauth_plan: max_20x}}
  - {name: anthropic, prefix: /claude-code, options: {oauth_key: claude-code-oauth, oauth_plan: max_20x, client_verification: claude-code}}

profiles:
  generation:
    # Texto sem tool calls: o Claude Code real apontado para cá executaria as
    # ferramentas inventadas (Bash, Write...) na máquina de quem testa.
    claude-code:
      mode: random
      tool_calls: {probability: 0}

models:
  - id: wwz-fast
    owned_by: white-wizard
    protocols: ["*"]
    context_window: 128000
    capabilities: {tools: true, reasoning: true, json_schema: true}
    latency: fast
    errors: none
    generation: default
  - id: wwz-realistic
    owned_by: white-wizard
    protocols: ["*"]
    context_window: 128000
    capabilities: {tools: true, reasoning: true}
    latency: gpt-4o-like
    errors: none
    generation: default
  # Os ids que o Claude Code 2.1.308 pede (testdata/real/claude-code/2.1.308/:
  # sonnet com OAuth, opus com chave; haiku nas tarefas leves). Preços e janelas
  # de examples/opencode-completo/config.yaml.
  - id: claude-sonnet-5-5
    display_name: Claude Sonnet 5.5
    owned_by: anthropic
    protocols: [anthropic]
    created: 1790553600
    context_window: 1000000
    max_output: 128000
    capabilities: {tools: true, reasoning: true, json_schema: true}
    pricing: {input_per_m: 2, output_per_m: 10, cache_read_per_m: 0.2, cache_write_per_m: 2.5}
    latency: gpt-4o-like
    errors: none
    generation: claude-code
  - id: claude-opus-5-5
    display_name: Claude Opus 5.5
    owned_by: anthropic
    protocols: [anthropic]
    created: 1790035200
    context_window: 1000000
    max_output: 128000
    capabilities: {tools: true, reasoning: true, json_schema: true}
    pricing: {input_per_m: 4, output_per_m: 20, cache_read_per_m: 0.2, cache_write_per_m: 5}
    latency: gpt-4o-like
    errors: none
    generation: claude-code
  - id: claude-haiku-5-5
    display_name: Claude Haiku 5.5
    owned_by: anthropic
    protocols: [anthropic]
    created: 1791331200
    context_window: 1000000
    max_output: 128000
    capabilities: {tools: true, reasoning: true, json_schema: true}
    pricing: {input_per_m: 0.1, output_per_m: 0.5, cache_read_per_m: 0.01, cache_write_per_m: 0.125}
    latency: gpt-4o-like
    errors: none
    generation: claude-code
