# Produção (ADR 0017, spec 019): porta 8003, indisponibilidade por janelas.
# Modelo de configuração SEM segredos: os placeholders WWZ_KEY_1..3 são trocados por
# `scripts/prod-deploy.sh render` no servidor (valores do .env); nunca vai ao repositório.
# Sem admin.debug: produção não herda o ajuste do compose de dev.
server:
  auth: keys
  reuseport: true

admin:
  debug: false

keys:
  - {key: ${WWZ_KEY_1}, label: prod-1, account: acct-prod, project: proj-prod}
  - {key: ${WWZ_KEY_2}, label: prod-2, account: acct-prod, project: proj-prod}
  - {key: ${WWZ_KEY_3}, label: prod-3, account: acct-prod, project: proj-prod}

drivers:
  - {name: openai}

models:
  - id: wwz-fast
    owned_by: white-wizard
    protocols: ["*"]
    context_window: 128000
    capabilities: {tools: true, reasoning: true, json_schema: true}
    latency: fast
    errors: none
    generation: default
  - id: wwz-realistic
    owned_by: white-wizard
    protocols: ["*"]
    context_window: 128000
    capabilities: {tools: true, reasoning: true}
    latency: gpt-4o-like
    errors: none
    generation: default

# Janela de 2 min a cada 10 min (minutos 0-1, 10-11, ... em UTC).
errors:
  outages:
    - {schedule: "0 */10 * * * *", duration: 2m, type: overloaded, timezone: UTC}
