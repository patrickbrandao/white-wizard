# Encaminhador TCP das portas 8000-8008 do host para as instancias (task 243).
# O Docker do servidor roda com iptables=false e userland-proxy=false, entao
# `ports:` nao publica nada; este container em network_mode: host escuta nas
# portas e repassa para os IPs fixos de wwz-internal. Sem firewall, sem DNAT.
#
# Este e o cfg generico do projeto: so as instancias do wwz, todas em TCP puro.
# Um servidor com outros servicos nas mesmas portas usa um cfg proprio fora do
# git (WWZ_PROD_HAPROXY em autor/prod.env, ADR 0076); o `prod-deploy.sh sync`
# envia esse no lugar deste.
global
    maxconn 200000
    log stdout format raw local0 warning

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client  10m
    timeout server  10m
    timeout client-fin 10s
    timeout server-fin 10s

# openai-perfeito
listen p8000
    bind 0.0.0.0:8000
    server s 198.18.128.11:8000

# falhas-20pct
listen p8001
    bind 0.0.0.0:8001
    server s 198.18.128.12:8000

# latencia-intermitente
listen p8002
    bind 0.0.0.0:8002
    server s 198.18.128.13:8000

# indisponibilidade
listen p8003
    bind 0.0.0.0:8003
    server s 198.18.128.14:8000

# anthropic (raiz com a assinatura OAuth do Claude Code)
listen p8004
    bind 0.0.0.0:8004
    server s 198.18.128.15:8000

# openrouter
listen p8005
    bind 0.0.0.0:8005
    server s 198.18.128.16:8000

# opencode
listen p8006
    bind 0.0.0.0:8006
    server s 198.18.128.17:8000

# admin (token obrigatorio)
listen p8007
    bind 0.0.0.0:8007
    server s 198.18.128.18:9000

# anthropic no modo estrito do Claude Code (ADR 0074, spec 020): a mesma
# instancia da 8004, base http://<ip publico>:8008/claude-code. TCP puro de
# proposito, mesmo num cfg proprio que ponha a 8004 em `mode http`: nesse modo
# o haproxy tira `Connection`, acrescenta X-Forwarded-For e reescreve a cabeca,
# e o wwz recusa toda requisicao com 403 forged_request_error.
listen p8008
    bind 0.0.0.0:8008
    mode tcp
    server s 198.18.128.15:8000
