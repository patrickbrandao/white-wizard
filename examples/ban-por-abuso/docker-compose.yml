# Exemplo ban-por-abuso (ADR 0016). wwz + Valkey (store compartilhado dos contadores
# e dos bloqueios).
#   docker compose up -d --wait        # porta do host: ${EX_PORT:-18108}, admin ${EX_ADMIN_PORT:-19108}
# O smoke.sh faz tudo isso (projeto wwz-ex-ban-por-abuso) e derruba com `down -v`.
name: wwz-ex-ban-por-abuso

services:
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8.1}-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    read_only: true
    tmpfs:
      - /run
      - /data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_CPUS:-1}"
          memory: "${VALKEY_MEMORY:-128m}"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  wwz:
    image: ${WWZ_IMAGE:-white-wizard:dev}
    environment:
      WWZ_CONFIG: /etc/wwz/wwz.yaml
      WWZ_ADMIN_TOKEN: wwz-ex-admin-token
    volumes:
      - ./config.yaml:/etc/wwz/wwz.yaml:ro
    ports:
      - "127.0.0.1:${EX_PORT:-18108}:8000"
      - "127.0.0.1:${EX_ADMIN_PORT:-19108}:9000" # admin: entidades, bloqueio e desbloqueio
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${WWZ_CPUS:-1}"
          memory: "${WWZ_MEMORY:-256m}"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/health/ready"]
      interval: 3s
      timeout: 3s
      start_period: 3s
      retries: 10
