# Exemplo cluster-3-instancias-valkey (ADR 0016). Três wwz + um Valkey
# compartilhado (limites do cluster). Portas do host: wwz1 ${EX_PORT:-18114},
# wwz2 ${EX_PORT2:-19114}, wwz3 ${EX_PORT3:-20114}.
#   docker compose up -d --wait
# O smoke.sh faz tudo isso (projeto wwz-ex-cluster-3-instancias-valkey) e derruba com `down -v`.
name: wwz-ex-cluster-3-instancias-valkey

x-wwz: &wwz
  image: ${WWZ_IMAGE:-white-wizard:dev}
  environment:
    WWZ_CONFIG: /etc/wwz/wwz.yaml
    WWZ_ADMIN_TOKEN: wwz-ex-admin-token
  volumes:
    - ./config.yaml:/etc/wwz/wwz.yaml:ro
  depends_on:
    valkey:
      condition: service_healthy
  read_only: true
  tmpfs:
    - /run
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  ulimits:
    nofile: { soft: 65536, hard: 65536 }
  deploy:
    resources:
      limits:
        cpus: "${WWZ_CPUS:-1}"
        memory: "${WWZ_MEMORY:-256m}"
  stop_grace_period: 10s
  healthcheck:
    test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/health/ready"]
    interval: 3s
    timeout: 3s
    start_period: 3s
    retries: 10

services:
  valkey:
    image: valkey/valkey:${VALKEY_VERSION:-8.1}-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    read_only: true
    tmpfs:
      - /run
      - /data
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${VALKEY_CPUS:-1}"
          memory: "${VALKEY_MEMORY:-128m}"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  wwz1:
    <<: *wwz
    ports:
      - "127.0.0.1:${EX_PORT:-18114}:8000"

  wwz2:
    <<: *wwz
    ports:
      - "127.0.0.1:${EX_PORT2:-19114}:8000"

  wwz3:
    <<: *wwz
    ports:
      - "127.0.0.1:${EX_PORT3:-20114}:8000"
