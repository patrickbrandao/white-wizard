# multi-provedor-failover: um wwz com os seis drivers montados por prefixo
# (spec 005): /openai, /anthropic, /openrouter, /opencode, /gemini e /azure.
# O OpenRouter é o provedor instável (30% das requisições falham); os outros
# cinco são perfeitos.
# Serve para medir o failover de um roteador: tentar o OpenRouter e, no erro,
# cair para o OpenAI.
#
# Cada driver tem o seu catálogo (`models[].drivers`, spec 003), então a
# instabilidade do OpenRouter vem do perfil de erros do modelo que só ele
# serve. `server.seed` fixo: o sorteio depende do primeiro prompt do usuário,
# então quem testa deve variar o prompt.
#
# Bases dos SDKs (http://host:8000):
#   openai     <base>/openai/v1
#   anthropic  <base>/anthropic
#   openrouter <base>/openrouter/api/v1
#   opencode   <base>/opencode/zen/go/v1
#   gemini     <base>/gemini (google-genai: base_url; x-goog-api-key)
#   azure      <base>/azure (AzureOpenAI: azure_endpoint; api-key; deployment gpt-4o-mini)
server:
  listen: ":8000"
  auth: keys
  seed: 77

admin:
  listen: ":9000"

keys:
  - { key: wwz-key-demo, label: demo }

drivers:
  - { name: openai, prefix: /openai }
  - { name: anthropic, prefix: /anthropic }
  - { name: openrouter, prefix: /openrouter }
  - { name: opencode, prefix: /opencode }
  - { name: gemini, prefix: /gemini }
  - { name: azure, prefix: /azure }

profiles:
  latency:
    rapida: { ttft: 5ms, itl: 1ms }
  errors:
    instavel:
      rate: 30
      types: [server_error, overloaded, rate_limit]
      weights: { server_error: 2, overloaded: 2, rate_limit: 1 }

models:
  # Estáveis.
  - id: gpt-4o-mini
    protocols: [openai]
    # No Azure, o deployment gpt-4o-mini (deployment = id, spec 005).
    drivers: [openai, azure]
    latency: rapida
  - id: claude-sonnet-4
    protocols: [anthropic]
    drivers: [anthropic]
    latency: rapida
  - id: kimi-k2
    protocols: [openai]
    drivers: [opencode]
    latency: rapida
  - id: gemini-2.5-flash
    protocols: [gemini]
    drivers: [gemini]
    latency: rapida
  # Instável: só o catálogo do OpenRouter.
  - id: openai/gpt-4o-mini
    protocols: [openai]
    drivers: [openrouter]
    latency: rapida
    errors: instavel

logging:
  level: warn
