# Exemplo multi-provedor-failover (ADR 0016). Um wwz com 6 drivers por prefixo (store em memória).
#   docker compose up -d --wait        # porta do host: ${EX_PORT:-18113}
# O smoke.sh faz tudo isso (projeto wwz-ex-multi-provedor-failover) e derruba com `down -v`.
name: wwz-ex-multi-provedor-failover

services:
  wwz:
    image: ${WWZ_IMAGE:-white-wizard:dev}
    environment:
      WWZ_CONFIG: /etc/wwz/wwz.yaml
      WWZ_ADMIN_TOKEN: wwz-ex-admin-token
    volumes:
      - ./config.yaml:/etc/wwz/wwz.yaml:ro
    ports:
      - "127.0.0.1:${EX_PORT:-18113}:8000"
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${WWZ_CPUS:-1}"
          memory: "${WWZ_MEMORY:-256m}"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/health/ready"]
      interval: 3s
      timeout: 3s
      start_period: 3s
      retries: 10
