# opencode-completo: o driver opencode com os catálogos reais de opencode.ai
# (ADR 0072, item 18), os planos Go, Go Plus e Go Teams, o pay-as-you-go,
# os modelos gratuitos e os budgets do Console.
#
# models[] sai das listagens públicas gravadas sem chave em 03/11/2026
# (testdata/real/opencode/catalog/payg_models.json, 79 modelos, e
# go_models.json, 28), não do snapshot do cliente. Um id que aparece nos dois
# catálogos é uma entrada só, com o que difere no Go em catalogs.opencode-go
# (preço, limites, capacidades e extra, inclusive o protocolo nativo em
# extra.api). Um id de um catálogo só tem catalogs com aquele catálogo.
# Convenções do gerador (script descartável, fora do repositório):
#   - display_name = name; context_window/max_output = limit.context/output;
#     capabilities = tools/reasoning.supported e structured_output (json_schema);
#   - protocols = dialeto do protocolo nativo (api); responses e o que difere
#     das capacidades derivadas da api vão em extra.api;
#   - owned_by = autor do canonical_id quando ele é <autor>/<id> e o autor não
#     é o prefixo do id; senão extra.canonical_id (null quando o real não tem);
#   - created = release_date (00:00 UTC); knowledge e last_updated diferentes
#     vão em extra;
#   - pricing = cost do catálogo (multipliers e overrides como no real);
#     gratuito = pricing com input_per_m 0 (9 no pay-as-you-go, 2 no Go);
#   - extra = o que o wwz não deriva (name, description, family, modalities,
#     limit.input, capacidades detalhadas, sdk próprio, cache.write 0...),
#     com null tirando o campo derivado que o real não lista.
# A listagem do wwz bate campo a campo com as fixtures, fora created e o host
# do base_url (o smoke.sh confere).
server:
  listen: ":8000"
  auth: keys

admin:
  listen: ":9000"

tiers:
  # Plano Go (US$ 10/mês): cota Go por modelo, mensal em dólares, com 5 h =
  # 20 % e semana = 50 % (valores publicados pelo opencode.ai). A cota cai pelo
  # opencode.allowance (0,6× a lista; 2× nos gemini-*), não pelo saldo.
  go:
    plan: go
    limits:
      quota_usd:
        rolling_5h_pct: 20
        weekly_pct: 50
        models:
          deepseek-v4.1-flash: 100
          glm-5.3-flash: 60
          kimi-k2.7-code: 60
          minimax-m3: 60
          kimi-k3: 15
          gpt-6-luna: 15
          claude-haiku-5-5: 15
  # Go Plus (US$ 40/mês, "~4× os limites"): ESTIMATIVA, 4× a tabela do Go; o
  # real não publica a tabela exata no relatório.
  go-plus:
    plan: go-plus
    limits:
      quota_usd:
        rolling_5h_pct: 20
        weekly_pct: 50
        models:
          deepseek-v4.1-flash: 400
          glm-5.3-flash: 240
          kimi-k2.7-code: 240
          minimax-m3: 240
          kimi-k3: 60
          gpt-6-luna: 60
          claude-haiku-5-5: 60
  # Go Teams (US$ 20/membro/mês): a cota conta no membro (keys[].project) e o
  # Extra Usage vem ligado. A tabela do Teams não é publicada: a do Go.
  go-teams:
    plan: go-teams
    limits:
      quota_usd:
        rolling_5h_pct: 20
        weekly_pct: 50
        models:
          deepseek-v4.1-flash: 100
          glm-5.3-flash: 60
          kimi-k2.7-code: 60
          minimax-m3: 60
          kimi-k3: 15
          gpt-6-luna: 15
          claude-haiku-5-5: 15
  # Só pay-as-you-go (Console com créditos): sem Go, 403 nas bases Go.
  payg:
    plan: none

accounts:
  - id: ws-go
    tier: go
  - id: ws-go-plus
    tier: go-plus
    extra_usage: true # cota estourada cai no saldo (402 com o saldo zerado)
    limits:
      credits_usd: 20
  - id: ws-teams
    tier: go-teams # extra_usage padrão true
    limits:
      credits_usd: 50
      spend_monthly_usd: 40 # budget do workspace (coverage all)
  - id: ws-payg
    tier: payg
    limits:
      credits_usd: 25
      spend_monthly_usd: 20 # budget do workspace (coverage all)
      spend_monthly_models_usd: # budgets por modelo (coverage models)
        opencode/claude-opus-5-5: 0.01 # baixo de propósito: o smoke estoura
        kimi-k3: 5

projects:
  - id: ana # membro do workspace ws-teams
    limits:
      spend_monthly_usd: 15

keys:
  - { key: wwz-key-go, label: go, account: ws-go }
  - { key: wwz-key-go-plus, label: go-plus, account: ws-go-plus }
  - { key: wwz-key-teams-ana, label: teams-ana, account: ws-teams, project: ana }
  - { key: wwz-key-teams-ci, label: teams-ci, account: ws-teams, service_account: true }
  - { key: wwz-key-payg, label: payg, account: ws-payg }

drivers:
  - name: opencode
    options:
      free_requests_per_day: "200" # cota diária de gratuitos (o real não publica)
      console_key: payg # o login do Console (device flow) aprova esta chave

profiles:
  latency:
    default: { ttft: 2ms, itl: 0ms } # rápido: o smoke termina em segundos

logging:
  level: warn

