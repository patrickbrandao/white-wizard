# raciocinio-longo (spec 019, ADR 0016): só o wwz, com store em memória.
#   EX_PORT=18112 docker compose up -d      # porta do host (padrão 18112)
#   docker compose down -v
name: wwz-ex-raciocinio-longo

services:
  wwz:
    image: ${WWZ_IMAGE:-white-wizard:dev}
    command: ["serve"]
    environment:
      WWZ_CONFIG: /etc/wwz/config.yaml
      WWZ_ADMIN_TOKEN: wwz-admin-example # token de teste, sem valor fora do exemplo
    volumes:
      - ./config.yaml:/etc/wwz/config.yaml:ro
    ports:
      - "127.0.0.1:${EX_PORT:-18112}:8000"
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          cpus: "${WWZ_CPUS:-1}"
          memory: "${WWZ_MEMORY:-256m}"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck", "http://127.0.0.1:9000/health/ready"]
      interval: 3s
      timeout: 3s
      start_period: 3s
      retries: 10
