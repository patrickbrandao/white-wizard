# stream-corta-no-meio: 30% dos streams são interrompidos no meio (spec 009).
# `mid_stream_rate` é o sorteio separado de falha após o primeiro byte;
# `mid_stream_types` escolhe o tipo: `stream_truncated` fecha a conexão sem
# `[DONE]` (OpenAI) / `message_stop` (Anthropic) e `stream_reset` manda um TCP RST.
# `after_ratio: 0.5` corta na metade dos chunks. Respostas sem stream não são
# afetadas. `seed` fixo: a mesma sequência de requisições corta os mesmos streams.
server:
  listen: ":8000"
  auth: keys
  seed: 20249

admin:
  listen: ":9000"

store:
  kind: memory

keys:
  - { key: wwz-key-demo, label: demo }

profiles:
  latency:
    rapida: { ttft: 5ms, itl: 2ms }
  errors:
    corta-30pct:
      rate: 0
      mid_stream_rate: 30
      mid_stream_types: [stream_truncated, stream_reset]
      after_ratio: 0.5

models:
  - id: gpt-4o-mini
    protocols: [openai]
    latency: rapida
    errors: corta-30pct
  - id: claude-sonnet-4
    protocols: [anthropic]
    latency: rapida
    errors: corta-30pct
